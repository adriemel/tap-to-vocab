<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <title>Quién soy yo – Tap-to-Vocab</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>

  <!-- Chat page (visible by default) -->
  <main class="qs-page" id="qs-page">
    <header class="qs-header">
      <div style="display:flex; align-items:center; gap:10px;">
        <a class="btn secondary" href="/" aria-label="Inicio">🏠</a>
        <h1>💬 Quién soy yo</h1>
      </div>
      <div class="qs-progress" id="qs-progress" aria-live="polite">1 / 14</div>
    </header>

    <section class="qs-chat" id="qs-chat" aria-live="polite" aria-label="Conversación"></section>

    <div id="qs-error" role="alert"></div>

    <div class="qs-answer-strip" id="qs-strip">
      <button type="button" class="qs-choice" id="qs-btn1" disabled>—</button>
      <button type="button" class="qs-choice" id="qs-btn2" disabled>—</button>
      <button type="button" class="qs-skip" id="qs-skip" disabled>&#10099; Skip</button>
    </div>
  </main>

  <!-- End screen (hidden until last question answered) -->
  <section class="qs-end" id="qs-end" aria-hidden="true">
    <div class="qs-end-card">
      <h2 class="qs-end-heading">¡Muy bien!</h2>
      <div class="qs-intro-label">Tu presentación:</div>
      <p class="qs-intro-text" id="qs-intro-text"></p>
      <div class="qs-end-actions">
        <button type="button" class="btn" id="qs-replay">↺ Replay</button>
        <button type="button" class="btn" id="qs-restart">Restart</button>
        <a class="btn secondary" id="qs-home" href="/">🏠</a>
      </div>
    </div>
  </section>

  <script src="/assets/js/coins.js"></script>
  <script src="/assets/js/shared-utils.js"></script>
  <script>
  (function () {
    /* ── TTS (verbatim from numbers-quiz.html lines 27–62, with iOS-safe setTimeout wrapper) ── */
    let _cachedSpanishVoice = null;
    let _voicesLoaded = false;

    function getSpanishVoice() {
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return null;
      const normalize = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
      const monica = voices.find(v => normalize(v.name).includes("monica") && v.lang.toLowerCase().startsWith("es"));
      if (monica) { _cachedSpanishVoice = monica; return monica; }
      const preferred = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("es"));
      _cachedSpanishVoice = preferred[0] || voices[0] || null;
      return _cachedSpanishVoice;
    }

    if (typeof speechSynthesis !== "undefined") {
      var _initialVoices = speechSynthesis.getVoices();
      if (_initialVoices.length) { _voicesLoaded = true; getSpanishVoice(); }
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.addEventListener("voiceschanged", function () {
          _voicesLoaded = true;
          getSpanishVoice();
        });
      }
    }

    function speakSpanish(text, onDone) {
      try {
        window.speechSynthesis.cancel();
        setTimeout(function () {
          var u = new SpeechSynthesisUtterance(text);
          u.lang = "es-ES";
          var v = getSpanishVoice();
          if (v) u.voice = v;
          u.rate = 0.95; u.pitch = 1.0;
          if (onDone) { u.onend = onDone; u.onerror = onDone; }
          window.speechSynthesis.speak(u);
        }, 100);
      } catch (e) {
        console.warn("Speech synthesis failed:", e);
        if (onDone) onDone();
      }
    }

    /* ── DOM refs ── */
    var pageEl     = document.getElementById('qs-page');
    var chatEl     = document.getElementById('qs-chat');
    var stripEl    = document.getElementById('qs-strip');
    var btn1       = document.getElementById('qs-btn1');
    var btn2       = document.getElementById('qs-btn2');
    var skipBtn    = document.getElementById('qs-skip');
    var progressEl = document.getElementById('qs-progress');
    var endEl      = document.getElementById('qs-end');
    var introTextEl= document.getElementById('qs-intro-text');
    var replayBtn  = document.getElementById('qs-replay');
    var restartBtn = document.getElementById('qs-restart');
    var errorEl    = document.getElementById('qs-error');

    /* ── State (closure-scoped) ── */
    var questions = [];        // array of {question, label1, label2, answer1, answer2}
    var currentIndex = 0;
    var chosenAnswers = [];
    var isAnswering = false;   // guards against double-tap during 1200ms transition

    function showError(msg) {
      errorEl.textContent = msg || 'No se pudo cargar la conversación. Recarga la página.';
      errorEl.style.display = 'block';
      stripEl.style.display = 'none';
    }

    /* ── Bubble rendering ── */
    function appendBubble(text, side) {
      // side: 'left' (question) or 'right' (answer)
      var row = document.createElement('div');
      row.className = 'qs-bubble-row ' + side;

      var bubble = document.createElement('div');
      bubble.className = 'qs-bubble ' + (side === 'left' ? 'question' : 'answer');
      bubble.textContent = text;

      row.appendChild(bubble);
      chatEl.appendChild(row);

      // CHAT-06: scroll to bottom so the 120px padding-bottom clears the fixed answer strip
      requestAnimationFrame(function () { chatEl.scrollTop = chatEl.scrollHeight; });
      return bubble;
    }

    /* ── Show question N (0-indexed) ── */
    function showQuestion(i) {
      currentIndex = i;
      var q = questions[i];

      // Render question bubble (CHAT-02)
      appendBubble(q.question, 'left');

      // AUDIO-01: speak question on appear
      speakSpanish(q.question);

      // Update progress pill (e.g., "3 / 14")
      progressEl.textContent = (i + 1) + ' / ' + questions.length;

      // CHAT-03: render two choice buttons with short labels
      btn1.textContent = q.label1;
      btn2.textContent = q.label2;
      // Accessibility: aria-label uses full answer text (per UI-SPEC Accessibility section)
      btn1.setAttribute('aria-label', q.answer1);
      btn2.setAttribute('aria-label', q.answer2);
      btn1.disabled = false;
      btn2.disabled = false;
      skipBtn.disabled = false;
    }

    /* ── Handle choice tap ── */
    function onChoiceTap(choiceIndex) {
      // Pitfall 2: guard against double-tap during 1200ms transition
      if (isAnswering) return;
      isAnswering = true;
      btn1.disabled = true;
      btn2.disabled = true;
      skipBtn.disabled = true;

      var q = questions[currentIndex];
      var answerText = (choiceIndex === 0) ? q.answer1 : q.answer2;
      chosenAnswers.push(answerText);

      // CHAT-04: append right-aligned answer bubble (also triggers CHAT-06 scroll)
      appendBubble(answerText, 'right');

      // AUDIO-02: speak chosen answer 400ms after it lands, then advance after TTS finishes
      var advanced = false;
      function advance() {
        if (advanced) return;
        advanced = true;
        setTimeout(function () {
          currentIndex++;
          if (currentIndex >= questions.length) {
            showEndScreen();
          } else {
            showQuestion(currentIndex);
          }
          isAnswering = false;
        }, 400);
      }
      setTimeout(function () {
        speakSpanish(answerText, advance);
        setTimeout(advance, 8000); // fallback if onend never fires
      }, 400);
    }

    btn1.addEventListener('click', function () { onChoiceTap(0); });
    btn2.addEventListener('click', function () { onChoiceTap(1); });
    skipBtn.addEventListener('click', function () {
      if (isAnswering) return;
      isAnswering = true;
      btn1.disabled = true;
      btn2.disabled = true;
      skipBtn.disabled = true;
      window.speechSynthesis.cancel();
      var done = false;
      function go() {
        if (done) return;
        done = true;
        setTimeout(function () {
          currentIndex++;
          if (currentIndex >= questions.length) {
            showEndScreen();
          } else {
            showQuestion(currentIndex);
          }
          isAnswering = false;
        }, 200);
      }
      go();
    });

    /* ── End screen ── */
    function buildParagraph() {
      // END-02: chosen answers joined with single space + closing line
      return chosenAnswers.join(' ') + ' ¡Muchas gracias por escuchar!';
    }

    function showEndScreen() {
      // END-01: hard swap (no transition) per UI-SPEC
      pageEl.style.display = 'none';
      endEl.classList.add('visible');
      endEl.setAttribute('aria-hidden', 'false');

      var paragraph = buildParagraph();
      introTextEl.textContent = paragraph;

      // END-03: auto-read paragraph 300ms after end screen paint
      setTimeout(function () { speakSpanish(paragraph); }, 300);
    }

    /* ── End screen actions ── */
    // END-04: replay re-reads the paragraph
    replayBtn.addEventListener('click', function () {
      speakSpanish(buildParagraph());
    });

    // END-05: start again resets state, hides end screen, shows chat with question 1
    restartBtn.addEventListener('click', function () {
      window.speechSynthesis.cancel();
      currentIndex = 0;
      chosenAnswers = [];
      isAnswering = false;
      chatEl.innerHTML = '';
      endEl.classList.remove('visible');
      endEl.setAttribute('aria-hidden', 'true');
      pageEl.style.display = '';   // restore default (flex via .qs-page rule)
      showQuestion(0);
    });
    // Note: END-06 (Inicio button) is a plain anchor with href="/" — no JS handler needed.

    /* ── Init: load TSV, kick off chat ── */
    SharedUtils.loadTSV('/data/quien-soy-sentences.txt').then(function (rows) {
      questions = rows
        .filter(function (r) {
          return r['Question'] && r['Answer choice 1'] && r['Answer choice 2'];
        })
        .map(function (r) {
          var choiceParts = (r['Choices (1,2)'] || '').split(', ');
          return {
            question: r['Question'],
            label1:   choiceParts[0] || 'Opción 1',
            label2:   choiceParts[1] || 'Opción 2',
            answer1:  r['Answer choice 1'],
            answer2:  r['Answer choice 2']
          };
        });
      if (!questions.length) { showError(); return; }
      function startWhenReady() {
        if (_voicesLoaded || typeof speechSynthesis === 'undefined') {
          showQuestion(0);
        } else {
          setTimeout(startWhenReady, 50);
        }
      }
      startWhenReady();
    }).catch(function (err) {
      console.error('Failed to load conversation data:', err);
      showError();
    });

  })();
  </script>
</body>
</html>
