<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <title>Tap‑to‑Vocab</title>
  <meta name="description" content="Learn Spanish vocabulary interactively with flashcards, quizzes, sentence building, and verb conjugation practice." />
  <meta property="og:title" content="Tap‑to‑Vocab" />
  <meta property="og:description" content="Learn Spanish vocabulary interactively with flashcards, quizzes, and games." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://tapvocab.fun/" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <script src="/assets/js/coins.js"></script>
  <script src="/assets/js/home.js"></script>
</head>
<body>
  <div class="container">
    <div class="card home">
      <header class="page-header">
        <div>
          <h1>Tap‑to‑Vocab</h1>
          <p class="page-subtitle">Learn Spanish vocabulary interactively</p>
        </div>
        <span class="badge coin-badge" id="coin-counter"><span class="coin-icon"></span> 0</span>
      </header>

      <section class="home-section" aria-labelledby="h-learn">
        <h2 class="section-title" id="h-learn">Learn words</h2>
        <div class="home-learn">
          <a class="home-tile tile-big tile-topics" href="/topics.html">
            <span class="tile-icon">📚</span>
            <span class="tile-label">Topics</span>
          </a>
          <a class="home-tile tile-big tile-unidades" href="/unidades.html">
            <span class="tile-icon">📖</span>
            <span class="tile-label">Unidades</span>
          </a>
          <a id="practice-btn" class="home-tile tile-row tile-practice" href="/topic.html?cat=practice">
            <span class="tile-icon">⭐</span>
            <span class="tile-label">Practice</span>
            <span class="tile-count" id="practice-count" hidden></span>
          </a>
        </div>
      </section>

      <section class="home-section" aria-labelledby="h-skills">
        <h2 class="section-title" id="h-skills">Practice skills</h2>
        <div class="home-skills">
          <a class="home-tile tile-sentences" href="/sentences.html">
            <span class="tile-icon">🔤</span><span class="tile-label">Build Sentences</span>
          </a>
          <a class="home-tile tile-verbs" href="/conjugation.html">
            <span class="tile-icon">🔄</span><span class="tile-label">Verbs</span>
          </a>
          <a class="home-tile tile-fill-blank" href="/fill-blank.html">
            <span class="tile-icon">✏️</span><span class="tile-label">Fill in</span>
          </a>
          <a class="home-tile tile-locations" href="/locations.html">
            <span class="tile-icon">📍</span><span class="tile-label">Locations</span>
          </a>
          <a class="home-tile tile-numbers" href="/numbers.html">
            <span class="tile-icon">🔢</span><span class="tile-label">Qué número es?</span>
          </a>
          <a class="home-tile tile-quien-soy" href="/quien-soy.html">
            <span class="tile-icon">💬</span><span class="tile-label">Quién soy yo</span>
          </a>
          <a class="home-tile tile-hora" href="/hora.html">
            <span class="tile-icon">🕐</span><span class="tile-label">Qué hora es?</span>
          </a>
        </div>
      </section>

      <section class="home-section" aria-labelledby="h-games">
        <h2 class="section-title" id="h-games">Games</h2>
        <div class="games-panel">
          <div class="games-progress-text">
            <span id="games-progress-label">0 / 10</span>
            <span id="games-progress-hint" class="games-hint"></span>
          </div>
          <div class="games-progress" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-labelledby="games-progress-label">
            <div class="games-progress-fill" id="games-progress-fill"></div>
          </div>
          <button class="btn btn-games" id="btn-games">🎮 Play Games (10 <span class="coin-icon"></span>)</button>
          <div id="coins-msg" class="coins-msg" hidden></div>
        </div>
      </section>

      <footer class="home-footer">
        <button type="button" class="link-btn" id="btn-reset-coins" title="Reset coins to 0">Reset coins</button>
      </footer>
    </div>
  </div>
</body>
</html>
